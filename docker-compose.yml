services:
  storefront:
    build:
      context: ./storefront
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://fakestoreapi.com}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
